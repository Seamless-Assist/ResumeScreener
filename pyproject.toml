[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-candidate-finder"
version = "0.1.0"
description = "SeamlessAssist local AI candidate finder"
readme = "REQUIREMENTS.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "openai>=1.25",
    "pymupdf>=1.24",
    "pypdf>=4.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.scripts]
SACandidateFinder = "sa_candidate_finder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
